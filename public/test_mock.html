const adm=async b=>{await api('/api/admin',{b});go('admin')},delTrack=async id=>{if(confirm('Delete this track?')){await api('/api/track?id='+id,{m:'DELETE'});go('studio')}};
async function like(id,b){try{const r=await api('/api/like',{b:{id}}),t=cache[id];if(t){t.liked=r.liked?1:0;t.likes=r.likes}const fd=b.closest('.fa');b.textContent=fd?(r.liked?'♥':'♡'):lk(t||{liked:r.liked,likes:r.likes});b.classList.toggle('on',r.liked);document.querySelectorAll(`[data-lc="${id}"]`).forEach(e=>e.textContent=r.likes);document.querySelectorAll(`.it[data-id="${id}"] .lk`).forEach(x=>{x.textContent=lk(t);x.classList.toggle('on',r.liked)});if(S.cur&&S.cur.id==id&&$('#np').classList.contains('open'))npRender();if(r.liked)toast('Added to liked songs')}catch(e){toast(e.message);authModal()}}
async function follow(id,b){try{const r=await api('/api/follow',{b:{id}});b.textContent=r.following?'Following':'Follow';b.classList.toggle('on',r.following);if($('#fc'))$('#fc').textContent=r.followers}catch(e){toast(e.message);authModal()}}
const M=h=>{$('#box').innerHTML=h;$('#modal').classList.add('show')},closeM=()=>{$('#modal').classList.remove('show');$('#box').innerHTML=''};
const owns=t=>S.owned.has(t.id)||(S.user&&(S.user.id==t.artistId||S.user.role=='admin')),payBtns=t=>(t.price>0?(owns(t)?`<button onclick="download('${t.id}')">⬇ Download</button>`:S.meta.payments?`<button onclick="buy('${t.id}')">Buy ${R(t.price)}</button>`:''):'')+(t.tip&&S.meta.payments?`<button class="g" onclick="tipModal('${t.artistId}')">💛 Tip</button>`:'');
function cmts(c){S.cm=c;const rp={};c.filter(x=>x.p).sort((a,b)=>a.d-b.d).forEach(x=>(rp[x.p]=rp[x.p]||[]).push(x));
 const one=(x,sub)=>`<div style="margin:10px 0 0 ${sub?'26px':'0'}"><b>${esc(x.name)}</b> <span class="mu">${new Date(x.d).toLocaleDateString('en-ZA')}</span><div>${esc(x.text)}</div><div><button class="ic ${x.liked?'on':''}" style="font-size:13px;padding:2px 6px" onclick="clike('${x.id}',this)">${x.liked?'♥':'♡'}${x.likes?' '+x.likes:''}</button><button class="ic" style="font-size:13px;padding:2px 6px" onclick="replyTo('${x.id}')">Reply</button></div></div>`;
 return c.filter(x=>!x.p).map(x=>one(x,0)+(rp[x.id]||[]).map(y=>one(y,1)).join('')).join('')||'<p class="mu">No comments yet.</p>'}
async function openVideo(feed){const t=S.cur;if(!t)return;S.reply=null;const c=await api('/api/comments?id='+t.id);if(t.kind=='video'&&!feed)A.pause();
 M(`${t.kind=='video'&&!feed?`<video src="/media/${t.media}" controls autoplay playsinline></video>`:art(t,'').replace('class="art "','class="art" style="height:200px;font-size:16px"')}<h2 style="margin:0">${esc(t.title)}</h2><div class="mu">${esc(t.artist)} · ${esc(t.genre)} · ${t.province}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="g ${t.liked?'on':''}" onclick="like('${t.id}',this)">${lk(t)}</button><button onclick="share('${t.id}')">Share</button>${payBtns(t)}<button class="g" onclick="closeM()">Close</button></div><div id="rp" class="mu"></div><textarea id="ct" rows="2" placeholder="Add a comment…"></textarea><button class="g" onclick="comment('${t.id}',${feed?1:0})">Post</button><div id="cl">${cmts(c)}</div>`)}
function replyTo(id){const x=S.cm.find(c=>c.id==id);S.reply=x;$('#rp').innerHTML=`Replying to <b>${esc(x.name)}</b> · <a style="cursor:pointer;color:var(--gold)" onclick="S.reply=null;$('#rp').textContent=''">cancel</a>`;$('#ct').focus()}
async function clike(id,b){try{const r=await api('/api/clike',{b:{id}});b.textContent=(r.liked?'♥':'♡')+(r.likes?' '+r.likes:'');b.classList.toggle('on',r.liked)}catch(e){toast(e.message);authModal()}}
async function comment(id,f){try{await api('/api/comment',{b:{id,text:$('#ct').value,parent:S.reply&&S.reply.id}});openVideo(f)}catch(e){toast(e.message)}}
async function share(id){const u=location.origin+'/?t='+id;if(navigator.share)navigator.share({title:cache[id].title,text:'Listen on Mzansi Beats',url:u}).catch(()=>{});else{navigator.clipboard.writeText(u);toast('Link copied')}}
async function menu(id){if(!S.user){toast('Sign in to save songs');return authModal()}const pl=await api('/api/playlists');M(`<h3>${esc(cache[id].title)}</h3><button onclick="enqueue('${id}')">Play next</button>${payBtns(cache[id])}${pl.map(p=>`<button class="g" onclick="addPl('${p.id}','${id}')">+ ${esc(p.name)}</button>`).join('')}<button class="g" onclick="newPl('${id}')">New playlist…</button><button class="g" onclick="share('${id}')">Share</button>`)}
async function addPl(pid,add){await api('/api/playlist',{b:{pid,add}});closeM();toast('Added')}
async function newPl(add){const name=prompt('Playlist name');if(!name)return;await api('/api/playlist',{b:{name,add}});closeM();toast('Playlist created');if(S.route[0]=='library')go('library')}
async function delPl(pid){if(confirm('Delete playlist?')){await api('/api/playlist',{b:{pid,del:1}});go('library')}}
function langModal(){M(`<h3>Language</h3>${[['en','English'],['zu','isiZulu'],['xh','isiXhosa'],['af','Afrikaans'],['st','Sesotho']].map(([c,n])=>`<button class="${S.lang==c?'':'g'}" onclick="S.lang='${c}';localStorage.mb_lang='${c}';closeM();go(...S.route)">${n}</button>`).join('')}`)}
function authBtn(){S.user?M(`<h3>${esc(S.user.name)}</h3><div class="mu">${S.user.role}</div>${S.user.role=='listener'?'<button onclick="becomeArtist()">Become an artist</button>':'<button onclick="closeM();go(\'studio\')">Studio</button>'}${S.user.role=='admin'?'<button class="g" onclick="closeM();go(\'admin\')">Admin</button>':''}<button class="g" onclick="profileModal()">Profile</button>${deferred?'<button class="g" onclick="installApp()">Install app</button>':''}<button class="g" onclick="logout()">${T('out')}</button>`):authModal()}
function authModal(reg){const o=S.meta.provinces.map(p=>`<option>${p}</option>`).join('');M(`<h2 style="margin:0">${reg?'Join Mzansi Beats':'Welcome back'}</h2>${reg?'<input id="an" placeholder="Name or artist name">':''}<input id="ae" type="email" placeholder="Email"><input id="ap" type="password" placeholder="Password (6+ chars)">${reg?`<select id="apr">${o}</select><label><input type="checkbox" id="aa" style="width:auto"> I'm a musician</label>`:''}<div id="er" style="color:var(--red)"></div><button onclick="doAuth(${reg?1:0})">${reg?'Create account':'Sign in'}</button><button class="g" onclick="authModal(${reg?0:1})">${reg?'Have an account? Sign in':'New here? Join free'}</button>`)}
async function doAuth(reg){try{const r=await api(reg?'/api/register':'/api/login',{b:{name:$('#an')?.value,email:$('#ae').value,password:$('#ap').value,province:$('#apr')?.value,artist:$('#aa')?.checked}});S.tok=r.token;S.user=r.user;localStorage.mb_tok=r.token;closeM();afterAuth();toast('Sawubona, '+r.user.name);go(S.route[0],S.route[1])}catch(e){$('#er').textContent=e.message}}
const logout=()=>{S.tok=S.user=null;afterAuth();$('#bdg').style.display='none';localStorage.removeItem('mb_tok');closeM();go('home')},becomeArtist=async()=>{S.user=await api('/api/profile',{b:{becomeArtist:1}});closeM();go('studio')};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});const installApp=()=>{deferred&&deferred.prompt();closeM()};
function profileModal(){const u=S.user;M(`<h3>Profile</h3>${u.role!='listener'?`<input id="pn" value="${esc(u.artist)}" placeholder="Artist name">`:''}<textarea id="pb" rows="3" placeholder="Bio">${esc(u.bio)}</textarea><select id="pp2">${S.meta.provinces.map(p=>`<option ${u.province==p?'selected':''}>${p}</option>`).join('')}</select>${u.role!='listener'?`<label><input type="checkbox" id="pm" style="width:auto" ${u.monetize?'checked':''}> Enable monetization (ZAR)</label><input id="ppr" type="number" min="0" value="${u.price}" placeholder="Default price (R)">`:''}<button onclick="saveProfile()">Save</button>`)}
async function saveProfile(){S.user=await api('/api/profile',{b:{artist:$('#pn')?.value,bio:$('#pb').value,province:$('#pp2').value,monetize:$('#pm')?.checked,price:$('#ppr')?.value}});closeM();toast('Saved');go(...S.route)}
function uploadModal(){M(`<h3>Upload</h3><input id="ut" placeholder="Track title"><input id="uab" placeholder="Album / EP name (optional)"><select id="ug">${S.meta.genres.map(g=>`<option>${g}</option>`).join('')}</select><select id="up">${S.meta.provinces.map(g=>`<option ${S.user.province==g?'selected':''}>${g}</option>`).join('')}</select><select id="uy"><option value="single">Single</option><option value="album">Album track</option><option value="video">Music video</option></select><select id="ul"><option value="en">English</option><option value="zu">isiZulu</option><option value="xh">isiXhosa</option><option value="af">Afrikaans</option><option value="st">Sesotho</option><option value="tn">Setswana</option></select>${S.user.monetize?'<input id="upr" type="number" min="0" placeholder="Price in ZAR (0 = free)">':''}<label class="mu">Audio / video file</label><input type="file" id="um" accept="audio/*,video/mp4,video/webm"><label class="mu">Cover art (optional)</label><input type="file" id="uc" accept="image/*"><textarea id="ulr" rows="3" placeholder="Lyrics (optional). Synced: [00:12.5]First line"></textarea><div class="prog"><div id="upg"></div></div><div id="us" class="mu"></div><button id="ub" onclick="doUpload()">Upload</button>`)}
function doUpload(){const m=$('#um').files[0];if(!m||!$('#ut').value)return toast('Title and file required');const f=new FormData();for(const[k,v]of[['title','ut'],['album','uab'],['genre','ug'],['province','up'],['type','uy'],['lang','ul'],['lyrics','ulr']])f.append(k,$('#'+v).value);if($('#upr'))f.append('price',$('#upr').value);if($('#uc').files[0])f.append('cover',$('#uc').files[0]);f.append('media',m);
 const x=new XMLHttpRequest();x.open('POST','/api/upload');x.setRequestHeader('Authorization','Bearer '+S.tok);$('#ub').disabled=true;x.upload.onprogress=e=>{if(e.lengthComputable){const p=e.loaded/e.total*100;$('#upg').style.width=p+'%';$('#us').textContent=Math.round(p)+'% uploaded'}};
 x.onload=()=>{if(x.status==200){closeM();toast('Published!');go('studio')}else{$('#us').textContent=JSON.parse(x.responseText).error;$('#ub').disabled=false}};x.onerror=()=>{$('#us').textContent='Network error';$('#ub').disabled=false};x.send(f)}

async function buy(id){if(!S.user){toast('Sign in to buy');return authModal()}try{const r=await api('/api/pay/init',{b:{kind:'purchase',t:id}});location.href=r.url}catch(e){toast(e.message)}}
function tipModal(aid){if(!S.user){toast('Sign in to tip');return authModal()}M(`<h3>Send a tip 💛</h3><div class="chips">${[10,20,50,100].map(v=>`<span class="chip" onclick="tip('${aid}',${v})">R${v}</span>`).join('')}</div><input id="tc" type="number" min="5" placeholder="Custom amount (R5–R5000)"><button onclick="tip('${aid}',+$('#tc').value)">Send tip</button><div class="mu">Secure payment by Paystack. 90% goes to the artist.</div>`)}
async function tip(a,v){try{const r=await api('/api/pay/init',{b:{kind:'tip',artist:a,amount:v}});location.href=r.url}catch(e){toast(e.message)}}
async function download(id){try{const r=await api('/api/dlink',{b:{id}});location.href=r.url}catch(e){toast(e.message)}}
async function handlePay(){const p=new URLSearchParams(location.search).get('pay');if(!p||!S.user)return;history.replaceState({},'','/');try{const r=await api('/api/pay/verify?ref='+encodeURIComponent(p));toast(r.status=='paid'?(r.kind=='tip'?'Thank you for the tip! 💛':'Purchase complete — find it in Library'):'Payment not completed');afterAuth()}catch(e){toast(e.message)}}
function afterAuth(){if(!S.user){S.owned=new Set();return}api('/api/purchases').then(l=>{reg(l);S.owned=new Set(ids(l))}).catch(()=>{});pollNotifs();if(!window._np)window._np=setInterval(pollNotifs,30000)}
async function pollNotifs(){if(!S.user)return;try{const d=await api('/api/notifs'),b=$('#bdg');S.nf=d.items;b.textContent=d.unread>9?'9+':d.unread;b.style.display=d.unread?'grid':'none'}catch(e){}}
async function notifModal(){await pollNotifs();const L={like:n=>`❤️ <b>${esc(n.name)}</b> liked “${esc(n.title||'your track')}”`,follow:n=>`➕ <b>${esc(n.name)}</b> started following you`,comment:n=>`💬 <b>${esc(n.name)}</b> commented on “${esc(n.title||'your track')}”: ${esc(n.text)}`,reply:n=>`↩️ <b>${esc(n.name)}</b> replied: ${esc(n.text)}`,clike:n=>`👍 <b>${esc(n.name)}</b> liked your comment`,sale:n=>`💰 <b>${esc(n.name)}</b> bought “${esc(n.title||'a track')}” (${esc(n.text)})`,tip:n=>`💛 <b>${esc(n.name)}</b> tipped you ${esc(n.text)}`};
 M(`<h3>Notifications</h3>${S.nf.map(n=>`<div style="padding:8px 0;border-bottom:1px solid var(--line);${n.read?'opacity:.6':''}">${(L[n.type]||(()=>''))(n)}<div class="mu">${new Date(n.d).toLocaleString('en-ZA')}</div></div>`).join('')||'<p class="mu">Nothing yet.</p>'}<button class="g" onclick="closeM()">Close</button>`);await api('/api/notifs/read',{b:{}});$('#bdg').style.display='none'}
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
(async()=>{S.meta=await api('/api/meta');if(S.tok)try{S.user=await api('/api/me')}catch(e){localStorage.removeItem('mb_tok');S.tok=null}
 afterAuth();await handlePay();await go('feed');setTimeout(()=>$('#splash').classList.add('h'),400);const t=new URLSearchParams(location.search).get('t');if(t){const l=reg(await api('/api/tracks?q='));const x=l.find(y=>y.id==t);if(x){LISTS[0]=[x.id];S.queue=[x];S.qi=0;load()}}})();
</script></body></html>
